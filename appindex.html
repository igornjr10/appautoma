<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Automatize Life | Premium AI</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Recharts -->
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #f5f5f5;
            -webkit-font-smoothing: antialiased;
        }
        .font-outfit {
            font-family: 'Outfit', sans-serif;
        }
        
        .transition-all {
            transition-property: all;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 300ms;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .glass-card {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 4s ease-in-out infinite; }
        
        .typing-dot { animation: typing 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        
        // --- GEMINI API INTEGRATION ---
        const apiKey = "AIzaSyDkLO25lwJeiSNCnzBH_H7fDSO-fcJcwxE"; 
        
        const callGeminiAPI = async (prompt, systemInstruction = "") => {
            if (!apiKey) {
                // Fallback Simulado (apenas se a chave falhar/estiver vazia)
                await new Promise(r => setTimeout(r, 1000));
                return "Modo de simulação: Configure a API Key para respostas reais.";
            }

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: systemInstruction }] }
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "Não consegui gerar uma resposta.";
            } catch (error) {
                console.error("Erro na API Gemini:", error);
                return "Erro de ligação à IA. Por favor tente novamente.";
            }
        };

        // Safe Recharts Access
        const Recharts = window.Recharts || {};
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, BarChart, Bar, Legend, PieChart, Pie, Cell } = Recharts;

        // --- SAFE ICON COMPONENT (Fixes removeChild error) ---
        const Icon = ({ name, size = 24, color = "currentColor", className = "" }) => {
            const ref = useRef(null);
            
            useEffect(() => {
                if (ref.current && window.lucide) {
                    // Limpa o conteúdo anterior com segurança
                    ref.current.innerHTML = '';
                    
                    // Cria o elemento i manualmente
                    const iconElement = document.createElement('i');
                    iconElement.setAttribute('data-lucide', name);
                    iconElement.style.width = `${size}px`;
                    iconElement.style.height = `${size}px`;
                    
                    ref.current.appendChild(iconElement);
                    
                    // Pede ao Lucide para renderizar dentro deste elemento específico
                    window.lucide.createIcons({
                        root: ref.current,
                        nameAttr: 'data-lucide',
                        attrs: {
                            class: className,
                            stroke: color
                        }
                    });
                }
            }, [name, size, color, className]);

            return <span ref={ref} style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }} />;
        };

        // --- COMPONENTS ---

        const Sidebar = ({ activeTab, setActiveTab }) => {
            const menuItems = [
                { id: 'dashboard', icon: 'layout-dashboard', label: 'Painel Principal' },
                { id: 'habits', icon: 'check-square', label: 'Hábitos & Tarefas' },
                { id: 'finance', icon: 'wallet', label: 'Finanças' },
                { id: 'training', icon: 'dumbbell', label: 'Treinos' },
                { id: 'ai', icon: 'sparkles', label: 'Assistente IA' },
            ];

            return (
                <aside className="hidden md:flex flex-col w-64 h-screen border-r border-white/5 bg-black/40 backdrop-blur-xl fixed left-0 top-0 z-50">
                    <div className="p-8 flex items-center gap-3">
                        <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center">
                            <span className="font-bold text-white">A</span>
                        </div>
                        <h1 className="text-xl font-outfit font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-400">
                            Automatize
                        </h1>
                    </div>
                    <nav className="flex-1 px-4 py-6 space-y-2">
                        {menuItems.map((item) => (
                            <button
                                key={item.id}
                                onClick={() => setActiveTab(item.id)}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-300 group ${
                                    activeTab === item.id 
                                    ? 'bg-indigo-600/10 text-indigo-400 border border-indigo-500/20 shadow-[0_0_20px_rgba(99,102,241,0.1)]' 
                                    : 'text-gray-500 hover:text-gray-300 hover:bg-white/5'
                                }`}
                            >
                                <Icon name={item.icon} size={20} className={activeTab === item.id ? 'text-indigo-400' : 'text-gray-500 group-hover:text-gray-300'} />
                                <span className="font-medium">{item.label}</span>
                                {activeTab === item.id && <div className="ml-auto w-1.5 h-1.5 rounded-full bg-indigo-400 shadow-[0_0_10px_rgba(99,102,241,0.8)]"></div>}
                            </button>
                        ))}
                    </nav>
                </aside>
            );
        };

        const Dashboard = ({ habits, transactions, tasks, workouts, onQuickAction }) => {
            const completedHabits = habits.filter(h => h.completedToday).length;
            const totalHabits = habits.length;
            const progress = totalHabits > 0 ? (completedHabits / totalHabits) * 100 : 0;
            const pendingTasks = tasks.filter(t => !t.completed).length;
            const income = transactions.filter(t => t.type === 'INCOME').reduce((acc, t) => acc + t.amount, 0);
            const expense = transactions.filter(t => t.type === 'EXPENSE').reduce((acc, t) => acc + t.amount, 0);
            const balance = income - expense;

            return (
                <div className="space-y-8 animate-float-in">
                    <header className="flex justify-between items-end">
                        <div>
                            <h2 className="text-3xl font-outfit font-bold text-white mb-2">Visão Geral</h2>
                            <p className="text-gray-400">Bem-vindo de volta! Aqui está o seu resumo diário.</p>
                        </div>
                        <div className="text-right hidden sm:block">
                            <p className="text-sm text-gray-500 uppercase tracking-widest font-semibold mb-1">Data de Hoje</p>
                            <p className="text-xl font-mono text-indigo-300">{new Date().toLocaleDateString('pt-PT')}</p>
                        </div>
                    </header>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        <div onClick={() => onQuickAction('habits')} className="glass-card p-6 rounded-2xl cursor-pointer hover:border-indigo-500/30 transition-all group">
                            <div className="flex justify-between items-start mb-4">
                                <div className="p-3 rounded-lg bg-indigo-500/10 text-indigo-400 group-hover:bg-indigo-500 group-hover:text-white transition-colors">
                                    <Icon name="activity" size={24} />
                                </div>
                                <span className="text-xs font-bold bg-white/5 px-2 py-1 rounded-full text-gray-400">HOJE</span>
                            </div>
                            <h3 className="text-gray-400 text-sm font-medium mb-1">Hábitos Completos</h3>
                            <div className="flex items-end gap-2">
                                <span className="text-3xl font-bold text-white">{completedHabits}/{totalHabits}</span>
                                <span className="text-sm text-indigo-400 mb-1">{Math.round(progress)}%</span>
                            </div>
                            <div className="w-full bg-gray-800 h-1.5 mt-4 rounded-full overflow-hidden">
                                <div className="bg-indigo-500 h-full rounded-full transition-all duration-1000" style={{ width: `${progress}%` }}></div>
                            </div>
                        </div>

                        <div onClick={() => onQuickAction('finance')} className="glass-card p-6 rounded-2xl cursor-pointer hover:border-emerald-500/30 transition-all group">
                            <div className="flex justify-between items-start mb-4">
                                <div className="p-3 rounded-lg bg-emerald-500/10 text-emerald-400 group-hover:bg-emerald-500 group-hover:text-white transition-colors">
                                    <Icon name="dollar-sign" size={24} />
                                </div>
                                <span className={`text-xs font-bold px-2 py-1 rounded-full ${balance >= 0 ? 'bg-emerald-500/10 text-emerald-400' : 'bg-red-500/10 text-red-400'}`}>SALDO</span>
                            </div>
                            <h3 className="text-gray-400 text-sm font-medium mb-1">Balanço Atual</h3>
                            <div className="flex items-end gap-2">
                                <span className="text-3xl font-bold text-white">€ {balance.toFixed(2)}</span>
                            </div>
                            <p className="text-xs text-gray-500 mt-2 flex items-center gap-1">
                                <Icon name="arrow-up" size={12} className="text-emerald-500" /> € {income} • <Icon name="arrow-down" size={12} className="text-red-500" /> € {expense}
                            </p>
                        </div>

                         <div onClick={() => onQuickAction('habits')} className="glass-card p-6 rounded-2xl cursor-pointer hover:border-orange-500/30 transition-all group">
                            <div className="flex justify-between items-start mb-4">
                                <div className="p-3 rounded-lg bg-orange-500/10 text-orange-400 group-hover:bg-orange-500 group-hover:text-white transition-colors">
                                    <Icon name="list-todo" size={24} />
                                </div>
                                <span className="text-xs font-bold bg-white/5 px-2 py-1 rounded-full text-gray-400">PENDENTE</span>
                            </div>
                            <h3 className="text-gray-400 text-sm font-medium mb-1">Tarefas Abertas</h3>
                            <div className="flex items-end gap-2">
                                <span className="text-3xl font-bold text-white">{pendingTasks}</span>
                            </div>
                        </div>

                        <div onClick={() => onQuickAction('training')} className="glass-card p-6 rounded-2xl cursor-pointer hover:border-blue-500/30 transition-all group">
                            <div className="flex justify-between items-start mb-4">
                                <div className="p-3 rounded-lg bg-blue-500/10 text-blue-400 group-hover:bg-blue-500 group-hover:text-white transition-colors">
                                    <Icon name="dumbbell" size={24} />
                                </div>
                                <span className="text-xs font-bold bg-white/5 px-2 py-1 rounded-full text-gray-400">FITNESS</span>
                            </div>
                            <h3 className="text-gray-400 text-sm font-medium mb-1">Treinos</h3>
                            <div className="flex items-end gap-2">
                                <span className="text-3xl font-bold text-white">{workouts.length}</span>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 mt-8">
                        <div className="lg:col-span-2 glass-card rounded-2xl p-6">
                            <h3 className="text-lg font-bold text-white mb-4 flex items-center gap-2">
                                <Icon name="bar-chart-2" size={20} className="text-indigo-400"/>
                                Desempenho Semanal
                            </h3>
                            <div className="h-64 w-full">
                            {BarChart ? (
                                <ResponsiveContainer width="100%" height="100%">
                                    <BarChart data={[ {name: 'Seg', val: 65}, {name: 'Ter', val: 80}, {name: 'Qua', val: 45}, {name: 'Qui', val: 90}, {name: 'Sex', val: 75}, {name: 'Sáb', val: 50}, {name: 'Dom', val: 60} ]}>
                                        <CartesianGrid strokeDasharray="3 3" stroke="#ffffff10" />
                                        <XAxis dataKey="name" stroke="#6b7280" />
                                        <Tooltip contentStyle={{backgroundColor: '#1f2937', border: 'none', borderRadius: '8px', color: '#fff'}} cursor={{fill: '#ffffff05'}} />
                                        <Bar dataKey="val" fill="#6366f1" radius={[4, 4, 0, 0]} />
                                    </BarChart>
                                </ResponsiveContainer>
                            ) : <div className="flex items-center justify-center h-full text-gray-500">A carregar gráficos...</div>}
                            </div>
                        </div>

                        <div className="glass-card rounded-2xl p-6">
                            <h3 className="text-lg font-bold text-white mb-4">Próximas Tarefas</h3>
                            <div className="space-y-3">
                                {tasks.filter(t => !t.completed).slice(0, 4).map(task => (
                                    <div key={task.id} className="flex items-center gap-3 p-3 rounded-lg bg-white/5 border border-white/5">
                                        <div className={`w-2 h-2 rounded-full ${task.priority === 'HIGH' ? 'bg-red-500' : task.priority === 'MEDIUM' ? 'bg-yellow-500' : 'bg-blue-500'}`}></div>
                                        <span className="text-sm text-gray-200 line-clamp-1">{task.title}</span>
                                    </div>
                                ))}
                                {tasks.filter(t => !t.completed).length === 0 && <p className="text-center text-gray-500 py-4">Tudo feito! 🎉</p>}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const HabitsModule = ({ habits, tasks, toggleHabit, setHabits, setTasks }) => {
            const [newHabitName, setNewHabitName] = useState('');
            const [newTaskTitle, setNewTaskTitle] = useState('');
            const [view, setView] = useState('habits');
            const [isSuggesting, setIsSuggesting] = useState(false);

            const addHabit = (e) => {
                e.preventDefault();
                if (!newHabitName.trim()) return;
                setHabits([...habits, { id: Date.now().toString(), name: newHabitName, streak: 0, completedToday: false, color: 'indigo' }]);
                setNewHabitName('');
            };

            const suggestHabit = async () => {
                if (isSuggesting) return;
                setIsSuggesting(true);
                const habitNames = habits.map(h => h.name).join(", ");
                const prompt = `O utilizador tem estes hábitos: ${habitNames}. Sugere APENAS UM novo hábito curto e saudável para adicionar (máximo 3-4 palavras). Responde apenas com o texto do hábito.`;
                const suggestion = await callGeminiAPI(prompt);
                // Limpeza básica da resposta
                setNewHabitName(suggestion.replace(/['"]/g, "").replace(/\.$/, "").trim());
                setIsSuggesting(false);
            };

            const addTask = (e) => {
                e.preventDefault();
                if (!newTaskTitle.trim()) return;
                setTasks([...tasks, { id: Date.now().toString(), title: newTaskTitle, completed: false, priority: 'MEDIUM', dueDate: new Date().toISOString().split('T')[0] }]);
                setNewTaskTitle('');
            };

            const toggleTask = (id) => setTasks(tasks.map(t => t.id === id ? {...t, completed: !t.completed} : t));
            const deleteHabit = (id) => setHabits(habits.filter(h => h.id !== id));
            const deleteTask = (id) => setTasks(tasks.filter(t => t.id !== id));

            return (
                <div className="space-y-6">
                    <div className="flex gap-4 border-b border-white/10 pb-4">
                        <button onClick={() => setView('habits')} className={`text-lg font-bold ${view === 'habits' ? 'text-indigo-400' : 'text-gray-500'}`}>Hábitos Diários</button>
                        <button onClick={() => setView('tasks')} className={`text-lg font-bold ${view === 'tasks' ? 'text-indigo-400' : 'text-gray-500'}`}>Tarefas & To-Do</button>
                    </div>

                    {view === 'habits' ? (
                        <div className="space-y-6">
                            <form onSubmit={addHabit} className="flex gap-2">
                                <input type="text" value={newHabitName} onChange={(e) => setNewHabitName(e.target.value)} placeholder="Novo hábito..." className="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition-colors" />
                                <button type="button" onClick={suggestHabit} disabled={isSuggesting} className="bg-gradient-to-r from-purple-600 to-indigo-600 hover:opacity-90 text-white rounded-xl px-4 py-3 font-medium transition-all disabled:opacity-50 flex items-center gap-2 min-w-[120px] justify-center">
                                    {isSuggesting ? <span className="animate-spin text-lg">✨</span> : <><Icon name="sparkles" size={18} /> <span className="hidden sm:inline">Sugerir</span></>}
                                </button>
                                <button type="submit" className="bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl px-6 py-3 font-medium transition-colors">Adicionar</button>
                            </form>
                            <div className="grid gap-4">
                                {habits.map(habit => (
                                    <div key={habit.id} className={`glass-card p-4 rounded-xl flex items-center justify-between group border-l-4 ${habit.completedToday ? 'border-l-emerald-500' : 'border-l-gray-700'}`}>
                                        <div className="flex items-center gap-4">
                                            <button onClick={() => toggleHabit(habit.id)} className={`w-8 h-8 rounded-lg flex items-center justify-center border transition-all ${habit.completedToday ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-gray-600 text-transparent hover:border-gray-400'}`}><Icon name="check" size={18} /></button>
                                            <div>
                                                <h4 className={`font-medium ${habit.completedToday ? 'text-gray-500 line-through' : 'text-white'}`}>{habit.name}</h4>
                                                <p className="text-xs text-gray-500">🔥 {habit.streak} dias de sequência</p>
                                            </div>
                                        </div>
                                        <button onClick={() => deleteHabit(habit.id)} className="text-gray-600 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity"><Icon name="trash-2" size={18} /></button>
                                    </div>
                                ))}
                                {habits.length === 0 && <div className="text-center text-gray-500 p-4">Sem hábitos. Use o botão Sugerir!</div>}
                            </div>
                        </div>
                    ) : (
                        <div className="space-y-6">
                            <form onSubmit={addTask} className="flex gap-2">
                                <input type="text" value={newTaskTitle} onChange={(e) => setNewTaskTitle(e.target.value)} placeholder="Nova tarefa..." className="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition-colors" />
                                <button type="submit" className="bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl px-6 py-3 font-medium transition-colors">Adicionar</button>
                            </form>
                            <div className="space-y-3">
                                {tasks.map(task => (
                                    <div key={task.id} className="glass-card p-4 rounded-xl flex items-center justify-between group">
                                        <div className="flex items-center gap-4">
                                            <button onClick={() => toggleTask(task.id)} className={`w-6 h-6 rounded border flex items-center justify-center transition-all ${task.completed ? 'bg-indigo-500 border-indigo-500 text-white' : 'border-gray-600 text-transparent'}`}><Icon name="check" size={14} /></button>
                                            <span className={`${task.completed ? 'text-gray-500 line-through' : 'text-gray-200'}`}>{task.title}</span>
                                        </div>
                                        <button onClick={() => deleteTask(task.id)} className="text-gray-600 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity"><Icon name="x" size={18} /></button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const FinanceModule = ({ transactions, addTransaction }) => {
            const [amount, setAmount] = useState('');
            const [description, setDescription] = useState('');
            const [type, setType] = useState('EXPENSE');
            const [advice, setAdvice] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!amount || !description) return;
                addTransaction({ amount: parseFloat(amount), description, type, category: 'Geral', date: new Date().toISOString() });
                setAmount(''); setDescription('');
            };

            const analyzeFinances = async () => {
                if (isAnalyzing) return;
                setIsAnalyzing(true);
                const txData = JSON.stringify(transactions.slice(0, 15));
                const prompt = `Analisa estas transações financeiras (JSON) e dá 3 dicas práticas e curtas em Português para o utilizador economizar. Usa bullet points. Dados: ${txData}`;
                const result = await callGeminiAPI(prompt);
                setAdvice(result);
                setIsAnalyzing(false);
            };

            const data = [
                { name: 'Entradas', value: transactions.filter(t => t.type === 'INCOME').reduce((a, b) => a + b.amount, 0), color: '#10b981' },
                { name: 'Saídas', value: transactions.filter(t => t.type === 'EXPENSE').reduce((a, b) => a + b.amount, 0), color: '#ef4444' },
            ];

            return (
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div className="lg:col-span-2 space-y-6">
                        <div className="glass-card p-6 rounded-2xl">
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="text-xl font-bold text-white">Histórico</h3>
                                <button onClick={analyzeFinances} disabled={isAnalyzing} className="text-xs bg-indigo-600/20 hover:bg-indigo-600 text-indigo-300 hover:text-white px-3 py-2 rounded-lg transition-all border border-indigo-500/30 flex items-center gap-2">
                                    {isAnalyzing ? <span className="animate-spin">✨</span> : <Icon name="sparkles" size={14} />} Consultor IA
                                </button>
                            </div>
                            
                            {advice && (
                                <div className="mb-4 p-4 rounded-xl bg-gradient-to-br from-indigo-900/40 to-purple-900/40 border border-indigo-500/30 animate-float-in">
                                    <h4 className="text-sm font-bold text-indigo-300 mb-2 flex items-center gap-2"><Icon name="bot" size={16}/> Análise Inteligente:</h4>
                                    <div className="text-sm text-gray-200 whitespace-pre-wrap leading-relaxed">{advice}</div>
                                </div>
                            )}

                            <div className="space-y-4 max-h-[500px] overflow-y-auto custom-scrollbar pr-2">
                                {transactions.map(t => (
                                    <div key={t.id} className="flex items-center justify-between p-4 rounded-xl bg-white/5 border border-white/5 hover:bg-white/10 transition-colors">
                                        <div className="flex items-center gap-4">
                                            <div className={`p-3 rounded-full ${t.type === 'INCOME' ? 'bg-emerald-500/20 text-emerald-500' : 'bg-red-500/20 text-red-500'}`}><Icon name={t.type === 'INCOME' ? 'arrow-up-right' : 'arrow-down-left'} size={20} /></div>
                                            <div><p className="font-medium text-white">{t.description}</p><p className="text-xs text-gray-500">{new Date(t.date).toLocaleDateString()}</p></div>
                                        </div>
                                        <span className={`font-mono font-bold ${t.type === 'INCOME' ? 'text-emerald-400' : 'text-red-400'}`}>{t.type === 'INCOME' ? '+' : '-'} € {t.amount.toFixed(2)}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                    <div className="space-y-6">
                         <div className="glass-card p-6 rounded-2xl">
                            <h3 className="text-lg font-bold text-white mb-4">Resumo</h3>
                             <div className="h-64 w-full relative">
                             {PieChart ? (
                                <ResponsiveContainer>
                                    <PieChart>
                                        <Pie data={data} innerRadius={60} outerRadius={80} paddingAngle={5} dataKey="value">
                                            {data.map((entry, index) => <Cell key={`cell-${index}`} fill={entry.color} />)}
                                        </Pie>
                                        <Tooltip contentStyle={{backgroundColor: '#1f2937', borderRadius: '8px', border: 'none'}} />
                                        <Legend />
                                    </PieChart>
                                </ResponsiveContainer>
                                ) : <div className="flex items-center justify-center h-full text-gray-500">Gráfico indisponível</div>}
                                <div className="absolute inset-0 flex items-center justify-center pointer-events-none"><span className="text-2xl font-bold text-white">€</span></div>
                            </div>
                        </div>
                        <div className="glass-card p-6 rounded-2xl">
                            <h3 className="text-lg font-bold text-white mb-4">Nova Transação</h3>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div className="grid grid-cols-2 gap-2">
                                    <button type="button" onClick={() => setType('INCOME')} className={`py-2 rounded-lg text-sm font-medium transition-all ${type === 'INCOME' ? 'bg-emerald-600 text-white' : 'bg-white/5 text-gray-400'}`}>Entrada</button>
                                    <button type="button" onClick={() => setType('EXPENSE')} className={`py-2 rounded-lg text-sm font-medium transition-all ${type === 'EXPENSE' ? 'bg-red-600 text-white' : 'bg-white/5 text-gray-400'}`}>Saída</button>
                                </div>
                                <input type="text" value={description} onChange={(e) => setDescription(e.target.value)} className="w-full bg-black/20 border border-white/10 rounded-lg px-3 py-2 text-white focus:border-indigo-500 focus:outline-none" placeholder="Ex: Supermercado" />
                                <input type="number" step="0.01" value={amount} onChange={(e) => setAmount(e.target.value)} className="w-full bg-black/20 border border-white/10 rounded-lg px-3 py-2 text-white focus:border-indigo-500 focus:outline-none" placeholder="0.00" />
                                <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition-colors">Adicionar</button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        const TrainingModule = ({ workouts, onAddWorkout }) => {
            const [suggestion, setSuggestion] = useState(null);
            const [loading, setLoading] = useState(false);

            const generateWorkout = async () => {
                if (loading) return;
                setLoading(true);
                const lastWorkout = workouts[0] ? `Último treino: ${workouts[0].type} em ${workouts[0].date}` : "Sem histórico.";
                const prompt = `Gera um plano de treino rápido (apenas texto simples) para hoje. Contexto: ${lastWorkout}. Foca em alta intensidade. Resposta curta em Português de Portugal.`;
                const result = await callGeminiAPI(prompt);
                setSuggestion(result);
                setLoading(false);
            };

            return (
                <div className="glass-card p-10 rounded-2xl text-center">
                    <div className="w-20 h-20 bg-gray-800 rounded-full flex items-center justify-center mx-auto mb-6 text-gray-500"><Icon name="dumbbell" size={40} /></div>
                    <h3 className="text-2xl font-bold text-white mb-2">Módulo de Treino</h3>
                    <div className="flex justify-center gap-4 mb-8 mt-6">
                        <button onClick={() => onAddWorkout({id: Date.now().toString(), type: 'STRENGTH', duration: 60, intensity: 'HIGH', date: new Date().toISOString()})} className="bg-white/10 hover:bg-white/20 text-white px-6 py-3 rounded-xl font-medium transition-colors">Registar Treino</button>
                        <button onClick={generateWorkout} disabled={loading} className="bg-gradient-to-r from-indigo-600 to-purple-600 hover:opacity-90 text-white px-6 py-3 rounded-xl font-medium transition-colors flex items-center gap-2">
                             {loading ? <span className="animate-spin">✨</span> : <Icon name="sparkles" size={18} />} Gerar Treino
                        </button>
                    </div>
                    {suggestion && <div className="mb-8 p-6 rounded-xl bg-white/5 border border-purple-500/30 text-left max-w-lg mx-auto animate-float-in">
                        <h4 className="text-purple-400 font-bold mb-2 flex items-center gap-2"><Icon name="zap" size={16}/> Sugestão do Coach IA:</h4>
                        <p className="text-gray-200 text-sm whitespace-pre-wrap leading-relaxed">{suggestion}</p>
                    </div>}
                    <div className="mt-8 grid gap-4 max-w-lg mx-auto text-left">
                        {workouts.map(w => (
                            <div key={w.id} className="bg-black/40 p-4 rounded-lg border border-white/5 flex justify-between items-center">
                                <div><p className="font-bold text-indigo-400">{w.type === 'STRENGTH' ? 'Musculação' : 'Cardio'}</p><p className="text-xs text-gray-500">{new Date(w.date).toLocaleDateString()} • {w.duration} min</p></div>
                                <span className="text-xs font-bold bg-white/10 px-2 py-1 rounded text-gray-300">{w.intensity}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const GeminiChat = ({ context }) => {
            const [messages, setMessages] = useState([{role: 'system', content: 'Olá! Sou o seu assistente. Como posso ajudar?'}]);
            const [input, setInput] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const messagesEndRef = useRef(null);

            useEffect(() => messagesEndRef.current?.scrollIntoView({ behavior: "smooth" }), [messages]);

            const sendMessage = async (e) => {
                e.preventDefault();
                if(!input.trim() || isLoading) return;
                
                const userMsg = {role: 'user', content: input};
                setMessages(prev => [...prev, userMsg]);
                setInput(''); 
                setIsLoading(true);

                // Contexto do App para a IA
                const appContextData = `
                    DADOS DO UTILIZADOR:
                    - Saldo: ${context.transactions.reduce((acc, t) => acc + (t.type === 'INCOME' ? t.amount : -t.amount), 0)} EUR
                    - Hábitos atuais: ${context.habits.map(h => h.name).join(', ')}
                    - Tarefas pendentes: ${context.tasks.filter(t => !t.completed).length}
                `;
                
                const responseText = await callGeminiAPI(`Pergunta: ${userMsg.content}`, `És um assistente pessoal útil. Responde em Português de Portugal. Usa este contexto: ${appContextData}`);
                
                setMessages(prev => [...prev, {role: 'system', content: responseText}]);
                setIsLoading(false);
            };

            return (
                <div className="h-[calc(100vh-140px)] flex flex-col glass-card rounded-2xl overflow-hidden">
                    <div className="flex-1 overflow-y-auto p-6 space-y-4 custom-scrollbar">
                        {messages.map((msg, idx) => (
                            <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[85%] p-4 rounded-2xl ${msg.role === 'user' ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-white/10 text-gray-200 rounded-bl-none border border-white/5'}`}>
                                    <p className="whitespace-pre-wrap leading-relaxed">{msg.content}</p>
                                </div>
                            </div>
                        ))}
                        {isLoading && <div className="flex justify-start"><div className="bg-white/10 p-4 rounded-2xl rounded-bl-none flex gap-2 items-center"><div className="w-2 h-2 bg-indigo-400 rounded-full typing-dot"></div><div className="w-2 h-2 bg-indigo-400 rounded-full typing-dot"></div><div className="w-2 h-2 bg-indigo-400 rounded-full typing-dot"></div></div></div>}
                        <div ref={messagesEndRef} />
                    </div>
                    <form onSubmit={sendMessage} className="p-4 bg-black/20 border-t border-white/5 flex gap-2">
                        <input value={input} onChange={(e) => setInput(e.target.value)} placeholder="Escreva aqui..." className="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition-colors" />
                        <button type="submit" disabled={isLoading} className="bg-indigo-600 hover:bg-indigo-700 text-white p-3 rounded-xl transition-colors disabled:opacity-50"><Icon name="send" size={20} /></button>
                    </form>
                </div>
            );
        };

        const Onboarding = ({ onComplete }) => (
            <div className="flex flex-col items-center justify-center min-h-screen p-6 text-center">
                <div className="w-24 h-24 bg-indigo-600 rounded-2xl flex items-center justify-center mb-8 shadow-[0_0_50px_rgba(79,70,229,0.5)]"><Icon name="rocket" size={48} className="text-white" /></div>
                <h1 className="text-4xl md:text-5xl font-bold text-white mb-4">Bem-vindo ao Automatize</h1>
                <p className="text-gray-400 text-lg max-w-md mb-8">A sua central definitiva para produtividade, finanças e treinos.</p>
                <button onClick={() => onComplete([])} className="bg-white text-black hover:bg-gray-200 px-8 py-4 rounded-full font-bold text-lg transition-all transform hover:scale-105">Começar Agora</button>
            </div>
        );

        const LiveAssistant = () => (
            <div className="fixed bottom-6 right-6 hidden md:flex z-50">
                <button className="w-14 h-14 bg-indigo-600 rounded-full flex items-center justify-center shadow-[0_0_30px_rgba(79,70,229,0.6)] hover:scale-110 transition-transform cursor-pointer group">
                     <Icon name="sparkles" size={24} className="text-white group-hover:rotate-12 transition-transform" />
                </button>
            </div>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [onboardingCompleted, setOnboardingCompleted] = useState(() => localStorage.getItem('onboarding_done') === 'true');
            const [habits, setHabits] = useState(() => JSON.parse(localStorage.getItem('habits')) || [{id: '1', name: 'Beber Água', streak: 5, completedToday: false}]);
            const [tasks, setTasks] = useState(() => JSON.parse(localStorage.getItem('tasks')) || []);
            const [transactions, setTransactions] = useState(() => JSON.parse(localStorage.getItem('transactions')) || [{id: '1', amount: 1500, description: 'Salário', type: 'INCOME', date: new Date().toISOString()}]);
            const [workouts, setWorkouts] = useState(() => JSON.parse(localStorage.getItem('workouts')) || []);

            useEffect(() => { localStorage.setItem('habits', JSON.stringify(habits)); }, [habits]);
            useEffect(() => { localStorage.setItem('tasks', JSON.stringify(tasks)); }, [tasks]);
            useEffect(() => { localStorage.setItem('transactions', JSON.stringify(transactions)); }, [transactions]);
            useEffect(() => { localStorage.setItem('workouts', JSON.stringify(workouts)); }, [workouts]);
            useEffect(() => { localStorage.setItem('onboarding_done', String(onboardingCompleted)); }, [onboardingCompleted]);

            const renderContent = () => {
                switch (activeTab) {
                    case 'dashboard': return <Dashboard habits={habits} transactions={transactions} tasks={tasks} workouts={workouts} onQuickAction={setActiveTab} />;
                    case 'habits': return <HabitsModule habits={habits} tasks={tasks} toggleHabit={(id) => setHabits(prev => prev.map(h => h.id === id ? { ...h, completedToday: !h.completedToday, streak: !h.completedToday ? h.streak + 1 : Math.max(0, h.streak - 1) } : h))} setHabits={setHabits} setTasks={setTasks} />;
                    case 'finance': return <FinanceModule transactions={transactions} addTransaction={(t) => setTransactions([{...t, id: Math.random().toString(36).substr(2, 9)}, ...transactions])} />;
                    case 'training': return <TrainingModule workouts={workouts} onAddWorkout={(w) => setWorkouts([w, ...workouts])} />;
                    case 'ai': return <GeminiChat context={{habits, transactions, tasks, workouts}} />;
                    default: return <Dashboard habits={habits} transactions={transactions} tasks={tasks} workouts={workouts} onQuickAction={setActiveTab} />;
                }
            };

            if (!onboardingCompleted) return <Onboarding onComplete={() => setOnboardingCompleted(true)} />;

            return (
                <div className="flex h-screen bg-[#050505] overflow-hidden text-gray-200">
                    <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} />
                    <main className="flex-1 overflow-y-auto relative transition-all duration-500 custom-scrollbar md:ml-64">
                        <div className="fixed top-[-10%] left-[10%] w-[500px] h-[500px] bg-indigo-600/10 blur-[120px] rounded-full pointer-events-none"></div>
                        <div className="fixed bottom-[-10%] right-[10%] w-[500px] h-[500px] bg-purple-600/10 blur-[120px] rounded-full pointer-events-none"></div>
                        <div className="max-w-7xl mx-auto p-4 md:p-10 pb-32 md:pb-12 relative z-10">{renderContent()}</div>
                    </main>
                    <LiveAssistant />
                    <nav className="fixed bottom-0 left-0 right-0 bg-black/80 backdrop-blur-2xl border-t border-white/5 md:hidden flex justify-around p-4 z-[90]">
                        {[{ id: 'dashboard', icon: 'layout-dashboard', label: 'Início' }, { id: 'habits', icon: 'check-square', label: 'Hábitos' }, { id: 'finance', icon: 'wallet', label: 'Finanças' }, { id: 'ai', icon: 'sparkles', label: 'IA' }].map(item => (
                            <button key={item.id} onClick={() => setActiveTab(item.id)} className={`flex flex-col items-center gap-1 transition-all ${activeTab === item.id ? 'text-indigo-400 scale-110' : 'text-gray-500'}`}><Icon name={item.icon} size={22} /><span className="text-[10px] font-bold uppercase tracking-widest">{item.label}</span></button>
                        ))}
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
